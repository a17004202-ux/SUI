<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SUI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090a0d;color:#f5f5f5;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:auto;min-height:100vh;background:#0d0f13}
.top{
 height:60px;border-bottom:1px solid #24262c;
 display:flex;align-items:center;padding:0 18px;
 font-size:21px;font-weight:700;
 position:sticky;top:0;background:#0d0f13;z-index:10
}
.top span{margin-left:auto;font-size:14px;color:#888}
.page{padding:18px 16px 85px}
h1{font-size:28px;margin:8px 0 5px}
h2{font-size:20px;margin:24px 0 12px}
.sub{color:#888;font-size:14px}
.card{
 background:#16181e;border:1px solid #292c34;
 border-radius:15px;padding:15px;margin-bottom:12px
}
.plot{
 display:flex;gap:12px;align-items:center
}
.plot-img,.char-img{
 width:58px;height:58px;border-radius:12px;
 background:#272a31;object-fit:cover;display:flex;
 align-items:center;justify-content:center;color:#777;
 overflow:hidden;flex-shrink:0
}
.plot-info{flex:1}
.plot-name{font-weight:700;font-size:17px}
.plot-desc{font-size:13px;color:#888;margin-top:5px}
.pill{
 display:inline-block;padding:5px 9px;border-radius:20px;
 background:#252832;color:#aaa;font-size:12px;margin-top:8px
}
.nav{
 position:fixed;bottom:0;left:0;right:0;height:65px;
 background:#111319;border-top:1px solid #292c34;
 display:flex;justify-content:center;z-index:20
}
.nav-inner{width:min(600px,100%);display:flex}
.nav button{
 flex:1;background:none;border:0;color:#777;font-size:12px
}
.nav button.active{color:#fff}
.nav b{display:block;font-size:21px;margin-bottom:2px}
.primary{
 width:100%;padding:14px;border:0;border-radius:13px;
 background:#fff;color:#000;font-weight:700;margin:8px 0
}
.secondary{
 width:100%;padding:13px;border:1px solid #30333b;
 border-radius:13px;background:#181a20;color:#fff;margin:5px 0
}
label{
 display:block;color:#aaa;font-size:13px;margin:15px 0 7px
}
input,textarea,select{
 width:100%;background:#17191f;color:#fff;
 border:1px solid #30333b;border-radius:11px;
 padding:12px;outline:none
}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#777}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hidden{display:none!important}
.back{background:none;border:0;color:#aaa;padding:0;font-size:15px}
.char-card{display:flex;gap:12px;align-items:center}
.char-card .details{flex:1}
.char-number{font-size:12px;color:#777}
.chat{
 height:calc(100vh - 125px);
 overflow-y:auto;padding:18px 15px 80px
}
.chat-head{
 display:flex;align-items:center;gap:10px;
 margin-bottom:20px
}
.chat-head .char-img{width:45px;height:45px}
.msg{
 max-width:82%;padding:11px 14px;border-radius:17px;
 margin:7px 0;line-height:1.55;font-size:15px
}
.ai{background:#20232b;margin-right:auto}
.me{background:#6850d9;margin-left:auto}
.sender{font-size:11px;color:#777;margin:10px 3px 3px}
.chat-input{
 position:fixed;bottom:65px;left:0;right:0;
 background:#111319;border-top:1px solid #292c34;padding:8px;
 display:flex;gap:7px;z-index:15
}
.chat-input input{border-radius:22px}
.chat-input button{
 width:48px;border:0;border-radius:50%;
 background:#fff;color:#000;font-size:19px
}
.section-title{
 display:flex;align-items:center;justify-content:space-between
}
.small-btn{
 border:1px solid #30333b;background:#181a20;color:#fff;
 border-radius:9px;padding:7px 10px
}
.empty{
 text-align:center;color:#777;padding:50px 20px
}
.range-text{color:#aaa;font-size:13px;margin-top:5px}
</style>
</head>

<body>
<div class="app">

<div class="top">
  <span id="topTitle">SUI</span>
  <span id="userStatus">ゲスト</span>
</div>

<!-- HOME -->
<section id="home" class="page">
  <h1>ホーム</h1>
  <div class="sub">あなたのプロットと公開作品</div>

  <h2>マイプロット</h2>
  <div id="myPlots"></div>

  <button class="primary" onclick="showPage('create')">
    ＋ 新しいプロットを作る
  </button>

  <h2>公開プロット</h2>
  <div class="card plot">
    <div class="plot-img">S</div>
    <div class="plot-info">
      <div class="plot-name">サンプルプロット</div>
      <div class="plot-desc">ここに公開されたプロットが表示されます。</div>
      <span class="pill">公開</span>
    </div>
  </div>
</section>

<!-- SEARCH -->
<section id="search" class="page hidden">
  <h1>検索</h1>
  <input id="searchInput" placeholder="プロットを検索..." oninput="searchPlots()">
  <div id="searchResults"></div>
</section>

<!-- CREATE -->
<section id="create" class="page hidden">
  <button class="back" onclick="showPage('home')">← 戻る</button>
  <h1>プロットを作成</h1>
  <div class="sub">世界観とキャラクターを細かく設定できます。</div>

  <label>プロット名</label>
  <input id="plotName" placeholder="例：放課後の世界">

  <label>説明</label>
  <textarea id="plotDesc" placeholder="このプロットについての説明"></textarea>

  <label>世界観</label>
  <textarea id="plotWorld" placeholder="時代、場所、世界の仕組みなど"></textarea>

  <label>ストーリー設定</label>
  <textarea id="plotStory" placeholder="物語の前提や現在の状況"></textarea>

  <label>重要なルール・設定</label>
  <textarea id="plotRules" placeholder="AIが守るべき設定、禁止事項、世界のルールなど"></textarea>

  <label>公開設定</label>
  <select id="plotPublic">
    <option value="private">非公開</option>
    <option value="public">公開</option>
  </select>

  <h2>キャラクター</h2>
  <div class="sub">最大8体まで登録できます。</div>

  <div id="characters"></div>

  <button class="secondary" id="addCharBtn" onclick="addCharacter()">
    ＋ キャラクターを追加
  </button>

  <button class="primary" onclick="savePlot()">
    プロットを保存
  </button>
</section>

<!-- CHAT -->
<section id="chatPage" class="hidden">
  <div class="chat-head" style="padding:10px 15px">
    <button class="back" onclick="showPage('home')">←</button>
    <div class="plot-img">S</div>
    <div>
      <b id="chatPlotName">プロット</b>
      <div class="sub">AIチャット</div>
    </div>
  </div>

  <div class="chat" id="chatMessages">
    <div class="sender">AI</div>
    <div class="msg ai">
      このプロットでの物語を始められます。
    </div>
  </div>

  <div class="chat-input">
    <input id="chatInput" placeholder="メッセージ..." 
           onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</section>

<!-- PROFILE -->
<section id="profile" class="page hidden">
  <h1>プロフィール</h1>

  <div class="card">
    <div style="font-size:20px;font-weight:bold">ゲストユーザー</div>
    <div class="sub">アカウント機能は次の段階で追加します。</div>
  </div>

  <button class="secondary">ログイン / アカウント作成</button>
</section>

<nav class="nav">
  <div class="nav-inner">
    <button onclick="showPage('home')" id="navHome" class="active">
      <b>⌂</b>ホーム
    </button>
    <button onclick="showPage('search')" id="navSearch">
      <b>⌕</b>検索
    </button>
    <button onclick="showPage('create')" id="navCreate">
      <b>＋</b>作成
    </button>
    <button onclick="showPage('profile')" id="navProfile">
      <b>○</b>プロフィール
    </button>
  </div>
</nav>

</div>

<script>
let characters=[];
let plots=JSON.parse(localStorage.getItem("suiPlots")||"[]");

function showPage(id){
  document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));

  if(id==="home")document.getElementById("navHome").classList.add("active");
  if(id==="search")document.getElementById("navSearch").classList.add("active");
  if(id==="create")document.getElementById("navCreate").classList.add("active");
  if(id==="profile")document.getElementById("navProfile").classList.add("active");

  if(id==="home")renderPlots();
}

function addCharacter(){
  if(characters.length>=8){
    alert("キャラクターは最大8体です。");
    return;
  }

  characters.push({
    name:"",
    image:"",
    personality:"",
    speech:"",
    firstPerson:"",
    secondPerson:"",
