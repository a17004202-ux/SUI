<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111318;
  color: white;
  font-family: sans-serif;
}

.header {
  height: 60px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #292c34;
  font-size: 20px;
  font-weight: bold;
}

.chat {
  height: calc(100vh - 120px);
  padding: 20px;
  overflow-y: auto;
}

.message {
  max-width: 80%;
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 18px;
  line-height: 1.5;
}

.ai {
  background: #272b35;
  margin-right: auto;
}

.user {
  background: #6c4cff;
  margin-left: auto;
}

.input-area {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 60px;
  display: flex;
  gap: 8px;
  padding: 8px;
  background: #181a20;
  border-top: 1px solid #292c34;
}

input {
  flex: 1;
  border: none;
  outline: none;
  border-radius: 22px;
  padding: 0 16px;
  background: #292d36;
  color: white;
  font-size: 16px;
}

button {
  width: 55px;
  border: none;
  border-radius: 22px;
  background: #7657ff;
  color: white;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="header">
  💬 AI Chat
</div>

<div class="chat" id="chat">
  <div class="message ai">
    こんにちは！今日はどうしたの？
  </div>
</div>

<div class="input-area">
  <input id="input" placeholder="メッセージ..." />
  <button onclick="send()">➤</button>
</div>

<script>
function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  if (input.value.trim() === "") return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = input.value;

  chat.appendChild(userMessage);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  setTimeout(() => {
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "なるほど！もっと聞かせて。";
    chat.appendChild(aiMessage);
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}
</script>

</body>
  </html>
